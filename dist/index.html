  <!-- Boot watchdog and error capture script (runs prior to module execution) -->
  <script>
    (function() {
      window.__AZRAQ_BOOTED__ = false;
      var bootTimer = null;
      var capturedErrors = [];

      window.__azraqBootRetry = function() {
        try {
          if (window.sessionStorage) {
            window.sessionStorage.removeItem('chunk_reload');
          }
        } catch(e) {}
        window.location.reload(true);
      };

      window.__azraqShowBootError = function(reason) {
        if (window.__AZRAQ_BOOTED__) return;
        if (bootTimer) clearTimeout(bootTimer);

        var progress = document.getElementById('azraq-loader-progress');
        var errorUi = document.getElementById('azraq-boot-error-ui');
        var errorDesc = document.getElementById('azraq-boot-error-desc');

        if (progress) progress.style.display = 'none';
        if (errorUi) {
          errorUi.style.display = 'flex';
          if (errorDesc && reason) {
            errorDesc.textContent = reason;
          }
        }
      };

      // 1. Capture script/link load failures and runtime exceptions
      window.addEventListener('error', function(event) {
        if (window.__AZRAQ_BOOTED__) return;
        var target = event.target;
        var isScriptOrLink = target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK');
        var msg = isScriptOrLink
          ? 'Failed to load script or stylesheet: ' + (target.src || target.href || 'unknown asset')
          : (event.message || 'An error occurred during application startup.');
        console.error('[AZRAQ Boot Failure]:', msg, event);
        capturedErrors.push(msg);
        window.__azraqShowBootError(msg);
      }, true);

      // 2. Capture unhandled promise rejections (dynamic import failure)
      window.addEventListener('unhandledrejection', function(event) {
        if (window.__AZRAQ_BOOTED__) return;
        var reason = (event && event.reason) ? (event.reason.message || String(event.reason)) : 'Module initialization rejected';
        console.error('[AZRAQ Boot Rejection]:', reason, event);
        capturedErrors.push(reason);
        window.__azraqShowBootError(reason);
      });

      // 3. Boot Watchdog Timer: triggers fallback if React does not mount within 8 seconds
      bootTimer = setTimeout(function() {
        if (!window.__AZRAQ_BOOTED__) {
          var detail = capturedErrors.length > 0 
            ? capturedErrors[0] 
            : 'Application took too long to start. Please check your connection and reload.';
          console.warn('[AZRAQ Boot Watchdog Timeout]:', detail);
          window.__azraqShowBootError(detail);
        }
      }, 8000);

      window.__AZRAQ_CLEAR_BOOT_TIMER__ = function() {
        window.__AZRAQ_BOOTED__ = true;
        if (bootTimer) clearTimeout(bootTimer);
      };
    })();
  </script>
