name: AZRAQ CI/CD & Deployment Verification

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# The static preview is published to gh-pages using the contents permission.
# The production application and /api routes are served by the standalone Node.js server.
permissions:
  contents: write

concurrency:
  group: azraq-ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test_and_build:
    name: Test & Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Full Audit & Security Test Suites
        run: npm test

      - name: Run Production Bundle Build
        run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: "335688416251-7cqlcbjbjstcc0jccafp73ukndemtlan.apps.googleusercontent.com"

      - name: Prepare GitHub Pages Mirror
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p ./gh-pages-dist
          cp -r ./dist/* ./gh-pages-dist/
          sed -i 's|href="/|href="/Azraq-Shop/|g' ./gh-pages-dist/index.html
          sed -i 's|src="/|src="/Azraq-Shop/|g' ./gh-pages-dist/index.html
          sed -i 's|"/assets/|"/Azraq-Shop/assets/|g' ./gh-pages-dist/index.html
          sed -i 's|"/branding/|"/Azraq-Shop/branding/|g' ./gh-pages-dist/index.html
          sed -i 's|"/data/|"/Azraq-Shop/data/|g' ./gh-pages-dist/index.html
          cp ./gh-pages-dist/index.html ./gh-pages-dist/404.html

      - name: Deploy Static Preview Mirror to gh-pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages-dist
          publish_branch: gh-pages
          force_orphan: true

  smoke_test:
    name: Backend API Verification
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: test_and_build
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Start Local Backend Server
        run: |
          node server.js &
          sleep 3

      - name: Verify Backend API Endpoints (Local Runner)
        run: node scripts/smoke_test_api.mjs
        env:
          TARGET_URL: "http://localhost:3000"

      - name: Verify Remote Production Gateway
        run: node scripts/smoke_test_api.mjs
        env:
          TARGET_URL: "https://azraq.azraqtrips.com"
        continue-on-error: true
